{% extends 'core/base.html' %}
{% block content %}
<h2>Delete {{ type }}</h2>
<p>Are you sure you want to delete <strong>"{{ object }}"</strong>? This cannot be undone.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Yes, Delete</button>
  <a href="{% url cancel_url %}">Cancel</a>
</form>
{% endblock %}
