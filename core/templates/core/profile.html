{% extends 'core/base.html' %}
{% block content %}
<h2>My Profile</h2>
<p><strong>Username:</strong> {{ user.username }}</p>
<p><strong>Role:</strong> {{ user.get_role_display }}</p>

<h3>Update Details</h3>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save Changes</button>
</form>
{% endblock %}
